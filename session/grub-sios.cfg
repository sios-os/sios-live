# SIOS GRUB theme
# Custom GRUB bootloader menu with SIOS branding.

set theme_name="sios"

# Colors: dark background, gold text
set menu_color_normal="white/black"
set menu_color_highlight="yellow/black"
set color_normal="light-gray/black"
set color_highlight="yellow/black"

# Background
# The background is set to dark — no image needed for the prototype.
export background_color="0,7,13"

# Menu timeout
set timeout=5
set default=0

# Title
menuentry "SIOS — Sovereign Interactive Operating System" --class sios {
    set root=(hd0,1)
    linux /boot/vmlinuz root=LABEL=sios-root ro quiet splash plymouth.theme=sios
    initrd /boot/initrd.img
}

menuentry "SIOS — Recovery Mode" --class sios-recovery {
    set root=(hd0,1)
    linux /boot/vmlinuz root=LABEL=sios-root ro single
    initrd /boot/initrd.img
}

menuentry "SIOS — Memory Test" --class memtest {
    set root=(hd0,1)
    linux16 /boot/memtest86+.bin
}
