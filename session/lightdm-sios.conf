# SIOS LightDM Greeter Configuration
#
# The greeter is the first thing the Creator sees. It shows the SIOS brand
# on a dark background with a minimalist login prompt.

[greeter]
# Minimal session selector — only SIOS is offered
show-session-label = true
default-session = SIOS

# Brand colors
background = #02070d
theme-name = SIOS-Greeter
icon-theme-name = Adwaita-Dark

# No user list — the Creator types their username
hide-user-list = true

# No guest account
allow-guest = false

# Clock format
clock-format = %H:%M

# Position
position = 50%,center
default-user-image = /usr/share/sios/greeter-icon.svg
